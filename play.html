<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis vs the Bot</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:1rem}
canvas{width:100%;max-width:640px;touch-action:none;background:#0a6b3a;border:3px solid #fff;border-radius:8px;cursor:none}
a{color:#7ab8ff}
</style>
<h2>🎾 Tennis vs the Bot</h2>
<p id="info"></p>
<canvas id="c" width="640" height="380"></canvas>
<p>Move your mouse or finger up and down. First to 5 wins. Tap or click to play again.</p>
<p><a href="https://github.com/Azaxek/Azaxek">&larr; Back to the shared match</a></p>
<script>
const c = document.getElementById("c"), g = c.getContext("2d"), W = 640, H = 380, PH = 80, SPEED = 3.4;
let me = H / 2, bot = H / 2, score = [0, 0], rally = 0, over = false, ball, last = 0, best = 0;
try { best = +localStorage.getItem("tennisBest") || 0; } catch {}

function serve(dir) { ball = {x: W / 2, y: H / 2, vx: 4.5 * dir, vy: Math.random() * 4 - 2}; rally = 0; }
function hit(paddle, isBot) { // angle depends on where the ball meets the paddle
  ball.vx = -Math.sign(ball.vx) * Math.min(11, Math.abs(ball.vx) * 1.06);
  ball.vy = (ball.y - paddle) / (PH / 2) * 6 + (isBot ? Math.random() * 4 - 2 : 0); // the bot varies its returns
  if (++rally > best) { best = rally; try { localStorage.setItem("tennisBest", best); } catch {} }
}
function point(w) {
  score[w]++;
  if (score[w] === 5) over = true; else serve(w ? -1 : 1);
}
function update(dt) {
  if (over) return;
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.y < 8 || ball.y > H - 8) { ball.vy = -ball.vy; ball.y = Math.max(8, Math.min(H - 8, ball.y)); }
  if (ball.vx < 0 && ball.x < 34 && ball.x > 16 && Math.abs(ball.y - me) < PH / 2 + 6) hit(me, false);
  if (ball.vx > 0 && ball.x > W - 34 && ball.x < W - 16 && Math.abs(ball.y - bot) < PH / 2 + 6) hit(bot, true);
  const target = ball.vx > 0 ? ball.y : H / 2, d = target - bot;
  bot += Math.max(-SPEED * dt, Math.min(SPEED * dt, d)); // the bot is a bit slower than the ball, so it can be beaten
  if (ball.x < 0) point(1); else if (ball.x > W) point(0);
}
function draw() {
  g.clearRect(0, 0, W, H);
  g.strokeStyle = "#fff6"; g.setLineDash([8, 10]); g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();
  g.fillStyle = "#4da3ff"; g.fillRect(16, me - PH / 2, 10, PH);
  g.fillStyle = "#ff5a5a"; g.fillRect(W - 26, bot - PH / 2, 10, PH);
  g.fillStyle = "#e8f542"; g.beginPath(); g.arc(ball.x, ball.y, 8, 0, 7); g.fill();
  document.getElementById("info").textContent = over
    ? (score[0] > score[1] ? "🏆 You won! Tap to play again." : "The bot won. Tap to try again.")
    : `You ${score[0]} – ${score[1]} Bot · Rally ${rally} · Your best rally ${best}`;
}
function loop(t) { update(Math.min(2.5, (t - last) / 16.7 || 1)); last = t; draw(); requestAnimationFrame(loop); }
function aim(y) { const r = c.getBoundingClientRect(); me = Math.max(PH / 2, Math.min(H - PH / 2, (y - r.top) * H / r.height)); }
c.addEventListener("pointermove", e => aim(e.clientY));
c.addEventListener("pointerdown", e => { aim(e.clientY); if (over) { score = [0, 0]; over = false; serve(1); } });
addEventListener("keydown", e => { if (e.key === "ArrowUp") me = Math.max(PH / 2, me - 30); if (e.key === "ArrowDown") me = Math.min(H - PH / 2, me + 30); });
serve(1); requestAnimationFrame(loop);
</script>
