name: Tennis
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: tennis
jobs:
  move:
    if: startsWith(github.event.issue.title, 'tennis:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the move
        env:
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: python3 tennis.py
      - name: Save the board
        run: |
          git config user.name "tennis-bot"
          git config user.email "tennis-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Tennis move" && git push; fi
      - name: Close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Move played! Refresh the profile in a minute."
